<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vini OS Clean Concept</title>
  <style>
    :root {
      color-scheme: dark;
      --text: #f5f7fb;
      --muted: rgba(245,247,251,.68);
      --glass: rgba(8, 10, 15, .46);
      --line: rgba(255,255,255,.13);
      --cyan: #6ee7ff;
      --pink: #ff7aa8;
      --violet: #9b8cff;
      --green: #35e67d;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      letter-spacing: 0;
    }

    body {
      display: grid;
      place-items: center;
      background: #05070d;
    }

    .desktop {
      position: relative;
      width: 1440px;
      height: 900px;
      overflow: hidden;
      background:
        radial-gradient(circle at 17% 18%, rgba(255,255,255,.80) 0 2px, transparent 3px),
        radial-gradient(circle at 42% 10%, rgba(255,255,255,.48) 0 1px, transparent 2px),
        radial-gradient(circle at 77% 15%, rgba(255,255,255,.42) 0 1px, transparent 2px),
        radial-gradient(circle at 68% 72%, rgba(115,161,255,.26), transparent 34%),
        linear-gradient(180deg, #111622 0%, #070a12 58%, #04060b 100%);
      box-shadow: 0 36px 120px rgba(0,0,0,.65);
    }

    .desktop::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 8% 12%, rgba(255,255,255,.48) 0 1px, transparent 1.6px),
        radial-gradient(circle at 22% 34%, rgba(255,255,255,.28) 0 1px, transparent 1.8px),
        radial-gradient(circle at 31% 18%, rgba(255,255,255,.32) 0 1px, transparent 1.5px),
        radial-gradient(circle at 48% 29%, rgba(255,255,255,.24) 0 1px, transparent 1.7px),
        radial-gradient(circle at 61% 12%, rgba(255,255,255,.30) 0 1px, transparent 1.6px),
        radial-gradient(circle at 84% 27%, rgba(255,255,255,.25) 0 1px, transparent 1.5px),
        radial-gradient(circle at 92% 9%, rgba(255,255,255,.38) 0 1px, transparent 1.7px);
      opacity: .8;
    }

    .wave {
      position: absolute;
      left: 365px;
      top: 178px;
      width: 710px;
      height: 410px;
      filter: drop-shadow(0 50px 80px rgba(0,0,0,.55));
    }

    .wave-core {
      position: absolute;
      left: 170px;
      top: 122px;
      width: 330px;
      height: 220px;
      border-radius: 46% 54% 58% 42% / 50% 42% 58% 50%;
      background:
        radial-gradient(circle at 28% 64%, rgba(255,122,168,.95), transparent 29%),
        radial-gradient(circle at 45% 49%, rgba(126,235,255,.80), transparent 31%),
        linear-gradient(130deg, #d9f8ff 0%, #76a7d9 34%, #182131 71%);
      transform: rotate(-10deg);
      clip-path: path("M 18 180 C 95 72, 155 16, 266 42 C 194 80, 164 114, 185 158 C 205 202, 273 199, 322 158 C 278 254, 191 286, 92 250 C 50 235, 21 212, 18 180 Z");
    }

    .spray {
      position: absolute;
      border-radius: 999px;
      background: rgba(226,246,255,.70);
      box-shadow:
        38px -42px 0 -1px rgba(226,246,255,.52),
        74px -76px 0 -2px rgba(226,246,255,.48),
        118px -104px 0 -1px rgba(226,246,255,.38),
        156px -136px 0 -2px rgba(226,246,255,.42),
        204px -124px 0 -1px rgba(226,246,255,.44),
        244px -96px 0 -2px rgba(226,246,255,.34),
        288px -72px 0 -1px rgba(226,246,255,.32),
        318px -22px 0 -2px rgba(226,246,255,.28),
        252px 14px 0 -1px rgba(226,246,255,.36),
        188px 40px 0 -2px rgba(226,246,255,.34),
        126px 60px 0 -1px rgba(226,246,255,.30),
        84px 82px 0 -2px rgba(226,246,255,.30);
    }

    .spray.one { left: 412px; top: 168px; width: 7px; height: 7px; }
    .spray.two { left: 500px; top: 216px; width: 5px; height: 5px; opacity: .75; transform: rotate(24deg); }
    .spray.three { left: 570px; top: 254px; width: 4px; height: 4px; opacity: .55; transform: rotate(-14deg); }

    .horizon {
      position: absolute;
      left: 0;
      right: 0;
      top: 545px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(180,210,238,.28), transparent);
    }

    .topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 32px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 12px;
      color: rgba(255,255,255,.82);
      font-size: 12px;
      background: rgba(2,4,8,.22);
      backdrop-filter: blur(14px);
    }

    .top-left,
    .top-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .top-right {
      justify-content: flex-end;
    }

    .top-center {
      font-weight: 650;
      color: rgba(255,255,255,.78);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-weight: 750;
    }

    .mark {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.92);
      color: #05070b;
      font-size: 11px;
      font-weight: 900;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--green);
      box-shadow: 0 0 13px rgba(53,230,125,.82);
    }

    .desktop-icons {
      position: absolute;
      left: 26px;
      top: 68px;
      display: grid;
      gap: 20px;
    }

    .desktop-icon {
      width: 82px;
      display: grid;
      justify-items: center;
      gap: 8px;
      color: rgba(255,255,255,.92);
      font-size: 12px;
      font-weight: 650;
      text-align: center;
      text-shadow: 0 2px 10px rgba(0,0,0,.65);
    }

    .icon-tile {
      width: 54px;
      height: 54px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: rgba(10,13,19,.42);
      border: 1px solid rgba(255,255,255,.13);
      box-shadow: 0 18px 36px rgba(0,0,0,.25);
      backdrop-filter: blur(14px);
      font-size: 26px;
    }

    .search {
      position: absolute;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      width: 440px;
      height: 42px;
      display: grid;
      grid-template-columns: 30px 1fr 24px;
      align-items: center;
      padding: 0 11px;
      border-radius: 11px;
      background: rgba(6,8,13,.58);
      border: 1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(18px) saturate(1.15);
      color: rgba(255,255,255,.70);
      box-shadow: 0 18px 50px rgba(0,0,0,.28);
    }

    .search span,
    .search input {
      font-size: 14px;
    }

    .search input {
      border: 0;
      outline: 0;
      min-width: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
    }

    .search input::placeholder {
      color: rgba(255,255,255,.58);
    }

    .task-window {
      position: absolute;
      right: 78px;
      top: 120px;
      width: 345px;
      border-radius: 16px;
      overflow: hidden;
      background: rgba(7,9,14,.48);
      border: 1px solid rgba(255,255,255,.14);
      box-shadow: 0 24px 70px rgba(0,0,0,.36);
      backdrop-filter: blur(22px) saturate(1.2);
    }

    .task-head {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      border-bottom: 1px solid rgba(255,255,255,.10);
      font-size: 13px;
      font-weight: 750;
    }

    .dots {
      display: flex;
      gap: 7px;
    }

    .dots i {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: rgba(255,255,255,.28);
    }

    .task-body {
      padding: 14px;
      display: grid;
      gap: 11px;
    }

    .task-row {
      display: grid;
      grid-template-columns: 18px 1fr;
      gap: 9px;
      color: rgba(255,255,255,.82);
      font-size: 12px;
      line-height: 1.38;
    }

    .check {
      width: 16px;
      height: 16px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: rgba(53,230,125,.16);
      color: #72ff9f;
      font-size: 10px;
      margin-top: 1px;
    }

    .working {
      width: 16px;
      height: 16px;
      border-radius: 999px;
      border: 2px solid rgba(110,231,255,.26);
      border-top-color: var(--cyan);
      margin-top: 1px;
    }

    .dock {
      position: absolute;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      height: 62px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 20px;
      background: rgba(7,9,14,.44);
      border: 1px solid rgba(255,255,255,.15);
      backdrop-filter: blur(24px) saturate(1.2);
      box-shadow: 0 20px 58px rgba(0,0,0,.38);
    }

    .dock-icon {
      position: relative;
      width: 46px;
      height: 46px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.13);
      font-size: 22px;
    }

    .dock-icon.active::after {
      content: "";
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: -5px;
      height: 4px;
      border-radius: 999px;
      background: var(--cyan);
      box-shadow: 0 0 14px rgba(110,231,255,.86);
    }

    .tray {
      position: absolute;
      right: 14px;
      bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      height: 30px;
      padding: 0 10px;
      border-radius: 999px;
      color: rgba(255,255,255,.82);
      font-size: 12px;
      background: rgba(7,9,14,.32);
      border: 1px solid rgba(255,255,255,.10);
      backdrop-filter: blur(16px);
    }
  </style>
</head>
<body>
  <main class="desktop">
    <div class="horizon"></div>
    <div class="wave">
      <div class="wave-core"></div>
      <div class="spray one"></div>
      <div class="spray two"></div>
      <div class="spray three"></div>
    </div>

    <header class="topbar">
      <div class="top-left">
        <span class="brand"><span class="mark">V</span> Vini Computer</span>
      </div>
      <div class="top-center">Monday, May 25 · 21:52</div>
      <div class="top-right">
        <span class="status-dot"></span>
        <span>Docker</span>
        <span>Net</span>
        <span>🔊</span>
        <span>▢</span>
      </div>
    </header>

    <div class="search">
      <span>⌕</span>
      <input placeholder="Search apps, files, projects..." />
      <span>⌄</span>
    </div>

    <section class="desktop-icons">
      <div class="desktop-icon"><span class="icon-tile">💻</span><span>Computer</span></div>
      <div class="desktop-icon"><span class="icon-tile">🏠</span><span>Home</span></div>
      <div class="desktop-icon"><span class="icon-tile">📁</span><span>Projects</span></div>
      <div class="desktop-icon"><span class="icon-tile">🧾</span><span>Proof</span></div>
    </section>

    <section class="task-window">
      <div class="task-head">
        <span>Current Task</span>
        <span class="dots"><i></i><i></i><i></i></span>
      </div>
      <div class="task-body">
        <div class="task-row"><span class="check">✓</span><span>Opened browser and found source page.</span></div>
        <div class="task-row"><span class="check">✓</span><span>Downloaded file to /a0/usr/downloads.</span></div>
        <div class="task-row"><span class="working"></span><span>Opening terminal to run verification script.</span></div>
      </div>
    </section>

    <nav class="dock" aria-label="Vini dock">
      <div class="dock-icon active">▦</div>
      <div class="dock-icon">🌐</div>
      <div class="dock-icon active">⌨</div>
      <div class="dock-icon">📁</div>
      <div class="dock-icon">▣</div>
      <div class="dock-icon">✎</div>
      <div class="dock-icon">⚙</div>
    </nav>

    <div class="tray">
      <span>50080</span>
      <span>9:52 PM</span>
    </div>
  </main>
</body>
</html>
