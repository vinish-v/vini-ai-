<html>
<head>
  <script type="module">
    import { store } from "/plugins/_desktop/webui/desktop-store.js";
  </script>
</head>
<body>
  <div x-data>
    <template x-if="$store.desktop">
      <div class="office-panel" x-create="$store.desktop.onMount($el, xAttrs($el) || {})" x-destroy="$store.desktop.cleanup()">
      <div class="office-shell">
        <div class="office-document-header" x-show="$store.desktop.hasActiveFile()" style="display: none;">
          <div class="office-document-title" :title="$store.desktop.tabLabel($store.desktop.session)">
            <span class="material-symbols-outlined office-document-icon" aria-hidden="true" x-text="$store.desktop.tabIcon($store.desktop.session)"></span>
            <span class="office-document-name" x-text="$store.desktop.tabTitle($store.desktop.session)"></span>
            <span class="office-document-dirty" x-show="$store.desktop.dirty" aria-hidden="true">*</span>
          </div>

          <button
            type="button"
            class="office-icon-button office-document-save-button"
            title="Save"
            aria-label="Save"
            :class="{ 'is-primary': $store.desktop.dirty }"
            :disabled="$store.desktop.saving"
            @click="$store.desktop.save()"
          >
            <span class="material-symbols-outlined" :class="{ spinning: $store.desktop.saving }" x-text="$store.desktop.saving ? 'progress_activity' : 'save'"></span>
          </button>

          <div class="office-file-actions" x-data="{ open: false }" @click.outside="open = false" @keydown.escape.window="open = false">
            <button
              type="button"
              class="office-icon-button office-file-menu-button"
              title="File actions"
              aria-label="File actions"
              aria-haspopup="menu"
              :aria-expanded="open.toString()"
              :disabled="$store.desktop.saving"
              @click.stop="open = !open"
            >
              <span class="material-symbols-outlined">more_vert</span>
            </button>
            <div class="office-new-menu office-file-menu" role="menu" x-show="open" @click.stop>
              <button type="button" class="office-new-menu-item" role="menuitem" :disabled="$store.desktop.saving" @click="open = false; $store.desktop.renameActiveFile()">
                <span class="material-symbols-outlined" aria-hidden="true">edit</span>
                <span>Rename</span>
              </button>
              <button type="button" class="office-new-menu-item" role="menuitem" :disabled="$store.desktop.loading" @click="open = false; $store.desktop.closeActiveFile()">
                <span class="material-symbols-outlined" aria-hidden="true">close</span>
                <span>Close File</span>
              </button>
            </div>
          </div>
        </div>

        <div class="office-state-line" x-show="$store.desktop.message || $store.desktop.error || $store.desktop.loading" style="display: none;">
          <span class="material-symbols-outlined" :class="{ spinning: $store.desktop.loading }" x-text="$store.desktop.loading ? 'progress_activity' : ($store.desktop.error ? 'error' : 'check_circle')"></span>
          <span x-text="$store.desktop.error || $store.desktop.message || 'Working'"></span>
        </div>

        <div class="office-body">
          <div class="office-editor-wrap" x-show="$store.desktop.session" style="display: none;">
            <div class="office-editor-scroll" :class="{ 'is-desktop': $store.desktop.hasOfficialOffice() }" @click.self="$store.desktop.focusEditor()">
              <template x-if="$store.desktop.hasOfficialOffice()">
                <div class="vini-os-frame" x-data="{ appLauncherOpen: false }" @keydown.escape.window="appLauncherOpen = false">
                  <div class="vini-os-wallpaper" aria-hidden="true">
                    <span class="vini-os-star star-a"></span>
                    <span class="vini-os-star star-b"></span>
                    <span class="vini-os-star star-c"></span>
                    <span class="vini-os-wave"></span>
                  </div>
                  <div class="vini-os-topbar">
                    <div class="vini-os-brand">
                      <span class="vini-os-mark">V</span>
                      <strong>Vini Computer</strong>
                    </div>
                    <div class="vini-os-status">
                      <span class="vini-os-pill">
                        <span class="vini-os-live-dot"></span>
                        Docker
                      </span>
                      <span class="vini-os-pill">
                        /a0/usr
                      </span>
                    </div>
                    <div class="vini-os-clock">Local runtime</div>
                  </div>
                  <div class="vini-os-readiness" x-show="$store.desktop.status?.readiness?.blockers?.length" style="display: none;">
                    <div class="vini-os-readiness-head">
                      <span class="material-symbols-outlined" aria-hidden="true">monitor_heart</span>
                      <strong>Desktop readiness</strong>
                    </div>
                    <div class="vini-os-readiness-grid">
                      <span>Display</span>
                      <strong x-text="$store.desktop.status?.readiness?.display || 'not started'"></strong>
                      <span>Active window</span>
                      <strong x-text="$store.desktop.status?.readiness?.active_window?.title || 'none'"></strong>
                      <span>Screenshot</span>
                      <strong x-text="$store.desktop.status?.readiness?.screenshot_fresh ? 'fresh' : 'not fresh'"></strong>
                    </div>
                    <template x-for="blocker in ($store.desktop.status?.readiness?.blockers || []).slice(0, 2)" :key="blocker.code + blocker.message">
                      <div class="vini-os-readiness-blocker">
                        <span x-text="blocker.code"></span>
                        <small x-text="blocker.message"></small>
                      </div>
                    </template>
                  </div>
                  <div
                    class="office-desktop-wrap"
                    data-office-desktop-host
                    x-init="$nextTick(() => $store.desktop.mountDesktopFrameHost($el))"
                  >
                  </div>
                  <div class="vini-os-launcher" x-show="appLauncherOpen" style="display: none;" @click.self="appLauncherOpen = false">
                    <div class="vini-os-launcher-panel" role="dialog" aria-label="Applications" @click.stop>
                      <div class="vini-os-launcher-head">
                        <div>
                          <strong>Applications</strong>
                          <span>Launch runtime apps inside Vini Computer</span>
                        </div>
                        <button type="button" class="vini-os-launcher-close" title="Close launcher" aria-label="Close launcher" @click="appLauncherOpen = false">
                          <span class="material-symbols-outlined">close</span>
                        </button>
                      </div>

                      <div class="vini-os-launcher-section">
                        <span class="vini-os-launcher-label">Office</span>
                        <div class="vini-os-app-grid">
                          <button type="button" class="vini-os-app-tile" @click="appLauncherOpen = false; $store.desktop.launchDesktopApp('writer')">
                            <span class="material-symbols-outlined">edit_note</span>
                            <strong>Writer</strong>
                            <small>LibreOffice</small>
                          </button>
                          <button type="button" class="vini-os-app-tile" @click="appLauncherOpen = false; $store.desktop.launchDesktopApp('calc')">
                            <span class="material-symbols-outlined">table_chart</span>
                            <strong>Calc</strong>
                            <small>LibreOffice</small>
                          </button>
                          <button type="button" class="vini-os-app-tile" @click="appLauncherOpen = false; $store.desktop.launchDesktopApp('impress')">
                            <span class="material-symbols-outlined">co_present</span>
                            <strong>Impress</strong>
                            <small>LibreOffice</small>
                          </button>
                        </div>
                      </div>

                      <div class="vini-os-launcher-section">
                        <span class="vini-os-launcher-label">Work</span>
                        <div class="vini-os-app-grid">
                          <button type="button" class="vini-os-app-tile" @click="appLauncherOpen = false; $store.rightCanvas?.open?.('browser')">
                            <span class="material-symbols-outlined">language</span>
                            <strong>Browser</strong>
                            <small>Web tasks</small>
                          </button>
                          <button type="button" class="vini-os-app-tile" @click="appLauncherOpen = false; $store.rightCanvas?.open?.('editor')">
                            <span class="material-symbols-outlined">article</span>
                            <strong>Editor</strong>
                            <small>Files and code</small>
                          </button>
                          <button type="button" class="vini-os-app-tile" @click="appLauncherOpen = false; $store.desktop.launchDesktopApp('terminal')">
                            <span class="material-symbols-outlined">terminal</span>
                            <strong>Terminal</strong>
                            <small>Shell</small>
                          </button>
                          <button type="button" class="vini-os-app-tile" @click="appLauncherOpen = false; $store.desktop.launchDesktopApp('workdir')">
                            <span class="material-symbols-outlined">folder</span>
                            <strong>Files</strong>
                            <small>Workdir</small>
                          </button>
                          <button type="button" class="vini-os-app-tile" @click="appLauncherOpen = false; $store.desktop.launchDesktopApp('projects')">
                            <span class="material-symbols-outlined">folder_special</span>
                            <strong>Projects</strong>
                            <small>/a0/usr/projects</small>
                          </button>
                          <button type="button" class="vini-os-app-tile" @click="appLauncherOpen = false; $store.desktop.launchDesktopApp('downloads')">
                            <span class="material-symbols-outlined">download</span>
                            <strong>Downloads</strong>
                            <small>/a0/usr/downloads</small>
                          </button>
                          <button type="button" class="vini-os-app-tile" @click="appLauncherOpen = false; $store.desktop.launchDesktopApp('settings')">
                            <span class="material-symbols-outlined">settings</span>
                            <strong>Settings</strong>
                            <small>Desktop</small>
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                  <div class="vini-os-dock" aria-label="Vini dock" @click.stop>
                    <button type="button" class="vini-os-dock-icon" :class="{ 'is-active': appLauncherOpen }" title="Applications" aria-label="Applications" @click="appLauncherOpen = !appLauncherOpen">
                      <span class="material-symbols-outlined">apps</span>
                    </button>
                    <button type="button" class="vini-os-dock-icon" title="Build" aria-label="Build" @click="$store.rightCanvas?.open?.('build')">
                      <span class="material-symbols-outlined">code_blocks</span>
                    </button>
                    <button type="button" class="vini-os-dock-icon" title="Browser" aria-label="Browser" @click="$store.rightCanvas?.open?.('browser')">
                      <span class="material-symbols-outlined">language</span>
                    </button>
                    <button type="button" class="vini-os-dock-icon" title="Editor" aria-label="Editor" @click="$store.rightCanvas?.open?.('editor')">
                      <span class="material-symbols-outlined">article</span>
                    </button>
                    <button type="button" class="vini-os-dock-icon" title="Terminal" aria-label="Terminal" @click="$store.desktop.runNewMenuAction('terminal')">
                      <span class="material-symbols-outlined">terminal</span>
                    </button>
                    <button type="button" class="vini-os-dock-icon" title="Files" aria-label="Files" @click="$store.desktop.runNewMenuAction('workdir')">
                      <span class="material-symbols-outlined">folder</span>
                    </button>
                    <button type="button" class="vini-os-dock-icon" title="Writer" aria-label="Writer" @click="$store.desktop.launchDesktopApp('writer')">
                      <span class="material-symbols-outlined">edit_note</span>
                    </button>
                    <button type="button" class="vini-os-dock-icon" title="Calc" aria-label="Calc" @click="$store.desktop.launchDesktopApp('calc')">
                      <span class="material-symbols-outlined">table_chart</span>
                    </button>
                    <button type="button" class="vini-os-dock-icon" title="Settings" aria-label="Settings" @click="$store.desktop.runNewMenuAction('settings')">
                      <span class="material-symbols-outlined">settings</span>
                    </button>
                  </div>
                  <div class="vini-os-tray" aria-hidden="true">
                    <span>50080</span>
                    <span>Live</span>
                  </div>
                </div>
              </template>
            </div>
          </div>

          <div class="office-desktop-empty" x-show="$store.desktop.shouldShowDesktopEmptyState()" style="display: none;">
            <span class="material-symbols-outlined" aria-hidden="true">power_settings_new</span>
            <span class="office-desktop-empty-title">Desktop is shut down</span>
            <button type="button" class="office-icon-button office-command-button" @click="$store.desktop.restartDesktopSession()">
              <span class="material-symbols-outlined" aria-hidden="true">restart_alt</span>
              <span class="office-button-label">Restart Desktop</span>
            </button>
          </div>
        </div>
      </div>
      </div>
    </template>
  </div>

  <style>
    .office-panel,
    .office-shell {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      background: var(--color-background);
      color: var(--color-text);
    }

    .office-panel {
      container-type: inline-size;
    }

    .modal-inner.office-modal {
      box-sizing: border-box;
      width: min(1120px, calc(100vw - 32px));
      height: min(820px, calc(100vh - 32px));
      min-width: min(720px, calc(100vw - 16px));
      min-height: min(520px, calc(100vh - 16px));
      max-width: none;
      max-height: none;
      resize: none;
      overflow: hidden;
      will-change: width, height, left, top;
    }

    .modal-inner.office-modal.is-resizing,
    .modal-inner.office-modal.is-dragging {
      user-select: none;
    }

    .modal-inner.office-modal.is-focus-mode {
      border-radius: 6px;
    }

    .modal-inner.office-modal .modal-scroll {
      display: flex;
      flex: 1 1 auto;
      min-height: 0;
      max-height: none;
      overflow: hidden;
      padding: 0;
    }

    .modal-inner.office-modal .modal-header {
      grid-template-columns: minmax(0, 1fr) auto auto;
    }

    .office-modal-input-shield {
      position: absolute;
      inset: 42px 0 0 0;
      z-index: 4;
      display: none;
      background: transparent;
    }

    .office-modal-resizer {
      position: absolute;
      z-index: 5;
      display: block;
      touch-action: none;
    }

    .office-modal-resizer.is-right {
      top: 42px;
      right: -4px;
      bottom: 12px;
      width: 10px;
      cursor: ew-resize;
    }

    .office-modal-resizer.is-bottom {
      right: 12px;
      bottom: -4px;
      left: 0;
      height: 10px;
      cursor: ns-resize;
    }

    .office-modal-resizer.is-corner {
      right: 0;
      bottom: 0;
      width: 22px;
      height: 22px;
      cursor: nwse-resize;
    }

    .office-modal-resizer.is-corner::after {
      content: "";
      position: absolute;
      right: 6px;
      bottom: 6px;
      width: 9px;
      height: 9px;
      border-right: 2px solid color-mix(in srgb, var(--color-text) 42%, transparent);
      border-bottom: 2px solid color-mix(in srgb, var(--color-text) 42%, transparent);
      border-radius: 1px;
    }

    .modal-inner.office-modal.is-focus-mode .office-modal-resizer {
      display: none;
    }

    .modal-inner.office-modal .modal-bd.office-modal-body,
    .modal-inner.office-modal .modal-bd.office-modal-body > x-component,
    .modal-inner.office-modal .modal-bd.office-modal-body > x-component > div[x-data],
    .modal-inner.office-modal .modal-bd.office-modal-body > x-component > .office-panel,
    .modal-inner.office-modal .modal-bd.office-modal-body > x-component > div[x-data] > .office-panel {
      display: flex;
      flex: 1 1 auto;
      min-height: 0;
      min-width: 0;
      width: 100%;
      height: 100%;
      padding: 0;
    }

    .office-toolbar {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      flex-wrap: nowrap;
      min-height: 0;
      padding: 6px 10px;
      overflow: hidden;
      border-bottom: 1px solid color-mix(in srgb, var(--color-border), transparent 20%);
      background: color-mix(in srgb, var(--color-background), var(--color-panel) 48%);
    }

    .office-toolbar-row {
      display: flex;
      align-items: center;
      flex: 0 0 auto;
      flex-wrap: nowrap;
      gap: 6px;
      width: 100%;
      min-width: 0;
      min-height: 32px;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: thin;
    }

    .office-tool-group {
      display: flex;
      align-items: center;
      flex-wrap: nowrap;
      flex: 0 0 auto;
      gap: 4px;
      min-width: 0;
    }

    .office-editor-tools {
      gap: 3px;
    }

    .office-tool-actions {
      justify-content: flex-end;
    }

    .office-toolbar-spacer {
      flex: 1 1 16px;
      min-width: 8px;
    }

    .office-toolbar-divider {
      flex: 0 0 auto;
      width: 1px;
      height: 22px;
      margin-inline: 2px;
      background: color-mix(in srgb, var(--color-border), transparent 18%);
    }

    .office-document-header {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 38px;
      padding: 5px 10px 5px 12px;
      border-bottom: 1px solid color-mix(in srgb, var(--color-border), transparent 22%);
      background: color-mix(in srgb, var(--color-panel), var(--color-background) 30%);
    }

    .office-document-title {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      flex: 1 1 auto;
      color: var(--color-text);
    }

    .office-document-icon {
      flex: 0 0 auto;
      font-size: 19px;
      line-height: 1;
    }

    .office-document-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 750;
      letter-spacing: 0;
      line-height: 1.2;
    }

    .office-document-dirty {
      flex: 0 0 auto;
      color: #2ca58d;
      font-size: 14px;
      font-weight: 800;
      line-height: 1;
    }

    .office-file-actions {
      position: relative;
      display: inline-flex;
      align-items: center;
      flex: 0 0 auto;
    }

    .office-document-save-button,
    .office-file-menu-button {
      width: 30px;
      height: 30px;
      min-width: 30px;
    }

    .office-header-actions {
      position: relative;
      display: inline-flex;
      align-items: center;
      flex: 0 0 auto;
    }

    .office-header-new-button {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 34px;
      min-height: 34px;
      padding: 0 9px 0 8px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      color: var(--color-text);
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 750;
      letter-spacing: 0;
      line-height: 1;
      opacity: 0.82;
      white-space: nowrap;
      transition: background-color 0.16s ease, border-color 0.16s ease, opacity 0.16s ease;
    }

    .office-header-new-button:hover,
    .office-header-actions.is-open .office-header-new-button {
      opacity: 1;
      border-color: color-mix(in srgb, var(--color-primary) 28%, var(--color-border));
      background: color-mix(in srgb, var(--color-background-hover) 72%, transparent);
    }

    .office-header-new-button .material-symbols-outlined {
      font-size: 18px;
      line-height: 1;
    }

    .office-header-new-button .office-new-chevron {
      margin-left: -2px;
      font-size: 16px;
      opacity: 0.8;
    }

    .office-new-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      z-index: 100;
      min-width: 184px;
      padding: 5px;
      border: 1px solid color-mix(in srgb, var(--color-border), transparent 10%);
      border-radius: 8px;
      background: color-mix(in srgb, var(--color-panel), var(--color-background) 10%);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.34);
    }

    .right-canvas-desktop-actions .office-new-menu {
      z-index: 4000;
    }

    .office-new-menu[hidden] {
      display: none;
    }

    .office-new-menu-item {
      appearance: none;
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      height: 32px;
      padding: 0 8px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: var(--color-text);
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 650;
      letter-spacing: 0;
      line-height: 1;
      text-align: left;
      white-space: nowrap;
    }

    .office-new-menu-item:hover {
      border-color: color-mix(in srgb, var(--color-primary) 22%, transparent);
      background: color-mix(in srgb, var(--color-background-hover) 76%, transparent);
    }

    .office-new-menu-item:disabled {
      cursor: default;
      opacity: 0.46;
    }

    .office-new-menu-item .material-symbols-outlined {
      flex: 0 0 auto;
      width: 18px;
      font-size: 18px;
      line-height: 1;
      text-align: center;
    }

    .office-icon-button,
    .office-tab,
    .office-tab-close {
      border: 1px solid color-mix(in srgb, var(--color-border), transparent 12%);
      border-radius: 8px;
      background: color-mix(in srgb, var(--color-panel), var(--color-background) 16%);
      color: inherit;
      transition: border-color 120ms ease, background 120ms ease, transform 120ms ease;
    }

    .office-icon-button {
      display: inline-grid;
      place-items: center;
      width: 32px;
      height: 32px;
      min-width: 32px;
      padding: 0;
    }

    .office-command-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      width: auto;
      max-width: 126px;
      padding: 0 8px;
      white-space: nowrap;
    }

    .office-command-button .office-button-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
    }

    .office-icon-button.is-primary {
      border-color: color-mix(in srgb, #2c7be5, var(--color-border) 20%);
      background: color-mix(in srgb, #2c7be5, var(--color-panel) 82%);
    }

    .office-icon-button.is-active {
      border-color: color-mix(in srgb, #2ca58d, var(--color-border) 24%);
      background: color-mix(in srgb, #2ca58d, var(--color-panel) 84%);
    }

    .office-icon-button:hover:not(:disabled),
    .office-tab:hover,
    .office-tab-close:hover {
      border-color: color-mix(in srgb, #2c7be5, var(--color-border) 45%);
      background: color-mix(in srgb, var(--color-panel), #2c7be5 8%);
    }

    .office-icon-button:disabled {
      cursor: default;
      opacity: 0.42;
    }

    .office-icon-button .material-symbols-outlined,
    .office-tab-icon {
      font-size: 19px;
      line-height: 1;
    }

    .office-tabs {
      display: flex;
      gap: 6px;
      min-height: 42px;
      padding: 7px 10px;
      overflow-x: auto;
      border-bottom: 1px solid color-mix(in srgb, var(--color-border), transparent 22%);
      background: color-mix(in srgb, var(--color-panel), var(--color-background) 28%);
    }

    .office-tab-shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 28px;
      align-items: center;
      min-width: 150px;
      max-width: 240px;
    }

    .office-tab-shell.is-system {
      grid-template-columns: minmax(0, 1fr);
      min-width: 172px;
    }

    .office-tab,
    .office-tab-close {
      height: 28px;
      min-height: 28px;
      border-radius: 7px;
    }

    .office-tab {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      border-top-right-radius: 0;
      border-bottom-right-radius: 0;
      padding: 0 8px;
      text-align: left;
    }

    .office-tab-shell.is-system .office-tab {
      border-radius: 7px;
    }

    .office-tab-close {
      display: grid;
      place-items: center;
      border-left: 0;
      border-top-left-radius: 0;
      border-bottom-left-radius: 0;
      padding: 0;
    }

    .office-tab-close .material-symbols-outlined {
      font-size: 17px;
    }

    .office-tab-shell.is-active .office-tab,
    .office-tab-shell.is-active .office-tab-close {
      border-color: color-mix(in srgb, #2c7be5, var(--color-border) 36%);
      background: color-mix(in srgb, #2c7be5, var(--color-panel) 88%);
    }

    .office-tab-shell.is-dirty .office-tab-title::after {
      content: " *";
      color: #2ca58d;
    }

    .office-tab-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      line-height: 1;
    }

    .office-state-line {
      display: flex;
      align-items: center;
      flex: 0 0 auto;
      gap: 8px;
      width: 100%;
      min-width: 0;
      min-height: 34px;
      box-sizing: border-box;
      padding: 6px 12px;
      border-bottom: 1px solid color-mix(in srgb, var(--color-border), transparent 28%);
      color: var(--color-text-secondary);
      font-size: 12px;
    }

    .office-state-line > .material-symbols-outlined {
      flex: 0 0 auto;
    }

    .office-state-line > span:not(.material-symbols-outlined) {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .office-body {
      position: relative;
      display: flex;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      background: var(--color-background);
    }

    .office-body.is-source {
      background: transparent;
    }

    .office-editor-wrap {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }

    .office-editor-scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      padding: 30px 24px;
    }

    .office-editor-scroll.is-source {
      display: flex;
      overflow: hidden;
      padding: var(--spacing-md);
      background: transparent;
    }

    .office-editor-scroll.is-desktop {
      display: flex;
      overflow: hidden;
      padding: 0;
      background: #050609;
    }

    .vini-os-frame {
      position: relative;
      display: block;
      flex: 1 1 auto;
      width: 100%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      border: 0;
      border-radius: 0;
      background:
        radial-gradient(circle at 72% 76%, rgba(80, 118, 190, 0.28), transparent 34%),
        linear-gradient(180deg, #111722 0%, #05070d 64%, #020307 100%);
    }

    .vini-os-wallpaper {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(2, 4, 10, 0.14), rgba(2, 4, 10, 0.32)),
        url("/plugins/_desktop/assets/vini-os-mountain.jpg") center / cover no-repeat;
    }

    .vini-os-wallpaper::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 54% 48%, transparent 0 42%, rgba(0, 0, 0, 0.20) 72%),
        linear-gradient(90deg, rgba(2, 4, 10, 0.24), transparent 36%, rgba(2, 4, 10, 0.14));
    }

    .vini-os-star {
      display: none;
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow:
        96px 76px 0 rgba(255, 255, 255, 0.42),
        210px 24px 0 rgba(255, 255, 255, 0.36),
        360px 128px 0 rgba(255, 255, 255, 0.34),
        520px 56px 0 rgba(255, 255, 255, 0.30);
    }

    .vini-os-star.star-a {
      left: 12%;
      top: 18%;
    }

    .vini-os-star.star-b {
      left: 48%;
      top: 28%;
      opacity: 0.72;
      transform: scale(0.72);
    }

    .vini-os-star.star-c {
      left: 70%;
      top: 14%;
      opacity: 0.56;
      transform: scale(0.62);
    }

    .vini-os-topbar {
      position: absolute;
      inset: 0 0 auto 0;
      z-index: 4;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      height: 34px;
      padding: 0 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(3, 5, 10, 0.36);
      backdrop-filter: blur(16px) saturate(1.12);
      color: var(--color-text);
      pointer-events: auto;
    }

    .vini-os-brand,
    .vini-os-status,
    .vini-os-pill,
    .vini-os-clock {
      display: inline-flex;
      align-items: center;
      min-width: 0;
    }

    .vini-os-brand {
      gap: 7px;
      justify-self: start;
      font-size: 12px;
      letter-spacing: 0;
      font-weight: 800;
    }

    .vini-os-mark {
      display: inline-grid;
      place-items: center;
      width: 20px;
      height: 20px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.92);
      color: #05070a;
      font-size: 12px;
      font-weight: 900;
    }

    .vini-os-status {
      justify-self: center;
      justify-content: center;
      gap: 7px;
      min-width: 0;
    }

    .vini-os-pill {
      gap: 6px;
      height: 24px;
      max-width: 180px;
      padding: 0 9px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.055);
      color: color-mix(in srgb, var(--color-text) 82%, transparent);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .vini-os-live-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: #35e67d;
      box-shadow: 0 0 13px rgba(53, 230, 125, 0.75);
    }

    .vini-os-clock {
      justify-self: end;
      color: color-mix(in srgb, var(--color-text) 72%, transparent);
      font-size: 12px;
      font-weight: 700;
    }

    .vini-os-search {
      display: none;
      position: absolute;
      top: 52px;
      left: 50%;
      z-index: 4;
      grid-template-columns: 28px minmax(0, 1fr) 24px;
      align-items: center;
      width: min(440px, calc(100% - 48px));
      height: 42px;
      padding: 0 10px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 12px;
      background: rgba(7, 9, 14, 0.58);
      box-shadow: 0 18px 46px rgba(0, 0, 0, 0.30);
      color: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(18px) saturate(1.16);
      transform: translateX(-50%);
    }

    .vini-os-readiness {
      position: absolute;
      top: 46px;
      right: 14px;
      z-index: 5;
      display: grid;
      gap: 9px;
      width: min(330px, calc(100% - 28px));
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      background: rgba(5, 7, 12, 0.76);
      color: rgba(255, 255, 255, 0.90);
      box-shadow: 0 22px 54px rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(18px) saturate(1.12);
      pointer-events: auto;
    }

    .vini-os-readiness-head {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      line-height: 1;
    }

    .vini-os-readiness-head .material-symbols-outlined {
      font-size: 18px;
      color: #f6c44f;
    }

    .vini-os-readiness-grid {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      gap: 5px 9px;
      font-size: 11px;
      line-height: 1.2;
    }

    .vini-os-readiness-grid span,
    .vini-os-readiness-blocker small {
      color: rgba(218, 228, 255, 0.62);
    }

    .vini-os-readiness-grid strong,
    .vini-os-readiness-blocker span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 760;
    }

    .vini-os-readiness-blocker {
      display: grid;
      gap: 3px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 11px;
      line-height: 1.25;
    }

    .vini-os-readiness-blocker small {
      display: -webkit-box;
      overflow: hidden;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .vini-os-search .material-symbols-outlined {
      font-size: 18px;
    }

    .vini-os-search input {
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--color-text);
      font: inherit;
      font-size: 13px;
    }

    .vini-os-search input::placeholder {
      color: rgba(255, 255, 255, 0.56);
    }

    .vini-os-desktop-icons {
      position: absolute;
      top: 68px;
      left: 22px;
      z-index: 4;
      display: grid;
      gap: 16px;
      width: 82px;
      pointer-events: auto;
    }

    .vini-os-shortcut {
      appearance: none;
      display: grid;
      justify-items: center;
      gap: 7px;
      width: 82px;
      min-height: 72px;
      border: 0;
      background: transparent;
      color: rgba(255, 255, 255, 0.92);
      cursor: pointer;
      font: inherit;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.15;
      text-align: center;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.78);
    }

    .vini-os-shortcut-icon {
      display: grid;
      place-items: center;
      width: 50px;
      height: 50px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 14px;
      background: rgba(7, 9, 14, 0.42);
      box-shadow: 0 16px 34px rgba(0, 0, 0, 0.28);
      font-size: 24px;
      backdrop-filter: blur(14px) saturate(1.12);
    }

    .vini-os-dock {
      position: absolute;
      left: 50%;
      bottom: 18px;
      z-index: 4;
      display: flex;
      align-items: center;
      gap: 8px;
      height: 60px;
      padding: 8px 11px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      background: rgba(7, 9, 14, 0.46);
      box-shadow: 0 20px 54px rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(24px) saturate(1.18);
      transform: translateX(-50%);
      pointer-events: auto;
    }

    .vini-os-launcher {
      position: absolute;
      inset: 34px 0 86px 0;
      z-index: 18;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 0 20px 18px;
      background: linear-gradient(180deg, rgba(2, 4, 10, 0.08), rgba(2, 4, 10, 0.46));
      backdrop-filter: blur(2px);
    }

    .vini-os-launcher-panel {
      width: min(650px, calc(100% - 20px));
      max-height: min(560px, calc(100% - 12px));
      overflow: auto;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 18px;
      background: rgba(6, 9, 15, 0.86);
      box-shadow: 0 26px 90px rgba(0, 0, 0, 0.48);
      backdrop-filter: blur(22px) saturate(1.15);
    }

    .vini-os-launcher-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .vini-os-launcher-head div {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 3px;
    }

    .vini-os-launcher-head strong {
      color: rgba(255, 255, 255, 0.94);
      font-size: 18px;
      line-height: 1.1;
    }

    .vini-os-launcher-head span,
    .vini-os-launcher-label,
    .vini-os-app-tile small {
      color: rgba(218, 228, 255, 0.64);
      font-size: 12px;
      line-height: 1.25;
    }

    .vini-os-launcher-close,
    .vini-os-app-tile {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.10);
      color: rgba(255, 255, 255, 0.90);
      cursor: pointer;
      font: inherit;
    }

    .vini-os-launcher-close {
      display: grid;
      flex: 0 0 34px;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.07);
    }

    .vini-os-launcher-close:hover,
    .vini-os-app-tile:hover {
      border-color: rgba(133, 177, 255, 0.38);
      background: rgba(255, 255, 255, 0.12);
    }

    .vini-os-launcher-close .material-symbols-outlined {
      font-size: 18px;
    }

    .vini-os-launcher-section {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-top: 14px;
    }

    .vini-os-launcher-section:first-of-type {
      margin-top: 0;
    }

    .vini-os-launcher-label {
      font-weight: 760;
      text-transform: uppercase;
    }

    .vini-os-app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(116px, 1fr));
      gap: 10px;
    }

    .vini-os-app-tile {
      display: flex;
      min-height: 104px;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-end;
      gap: 5px;
      padding: 12px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.075);
      text-align: left;
      transition: background-color 0.16s ease, border-color 0.16s ease, transform 0.16s ease;
    }

    .vini-os-app-tile:hover {
      transform: translateY(-1px);
    }

    .vini-os-app-tile .material-symbols-outlined {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 11px;
      background: rgba(103, 151, 255, 0.18);
      color: rgba(216, 231, 255, 0.96);
      font-size: 21px;
    }

    .vini-os-app-tile strong {
      max-width: 100%;
      overflow: hidden;
      color: rgba(255, 255, 255, 0.94);
      font-size: 13px;
      font-weight: 760;
      line-height: 1.15;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .vini-os-dock-icon {
      appearance: none;
      position: relative;
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.09);
      color: rgba(255, 255, 255, 0.90);
      cursor: pointer;
      transition: background-color 0.14s ease, transform 0.14s ease;
    }

    .vini-os-dock-icon:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-1px);
    }

    .vini-os-dock-icon.is-active::after {
      content: "";
      position: absolute;
      right: 15px;
      bottom: -5px;
      left: 15px;
      height: 4px;
      border-radius: 999px;
      background: #6ee7ff;
      box-shadow: 0 0 14px rgba(110, 231, 255, 0.82);
    }

    .vini-os-dock-icon .material-symbols-outlined {
      font-size: 21px;
    }

    .vini-os-tray {
      position: absolute;
      right: 14px;
      bottom: 14px;
      z-index: 4;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      height: 28px;
      padding: 0 10px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 999px;
      background: rgba(7, 9, 14, 0.32);
      color: rgba(255, 255, 255, 0.78);
      font-size: 11px;
      font-weight: 700;
      backdrop-filter: blur(16px);
    }

    .office-desktop-wrap {
      position: absolute;
      inset: 34px 0 86px 0;
      z-index: 1;
      display: flex;
      width: auto;
      height: auto;
      min-width: 0;
      min-height: 0;
      aspect-ratio: auto;
      background: transparent;
    }

    .office-desktop-empty {
      display: grid;
      flex: 1 1 auto;
      place-items: center;
      align-content: center;
      gap: 12px;
      min-width: 0;
      min-height: 0;
      padding: 24px;
      color: var(--color-text-secondary);
      text-align: center;
    }

    .office-desktop-empty > .material-symbols-outlined {
      font-size: 32px;
      color: color-mix(in srgb, var(--color-text) 68%, transparent);
    }

    .office-desktop-empty-title {
      font-size: 13px;
      font-weight: 700;
    }

    .office-desktop-frame {
      flex: 1 1 auto;
      width: 100%;
      height: 100%;
      min-height: 0;
      aspect-ratio: auto;
      border: 0;
      background: transparent;
    }

    .office-panel .spinning {
      animation: office-spin 0.8s linear infinite;
    }

    @keyframes office-spin {
      to { transform: rotate(360deg); }
    }

    @container (max-width: 680px) {
      .vini-os-topbar {
        grid-template-columns: 1fr auto;
        height: 32px;
        padding-inline: 8px;
      }

      .vini-os-status {
        display: none;
      }

      .vini-os-clock {
        justify-content: flex-end;
      }

      .vini-os-search {
        top: 44px;
        width: calc(100% - 28px);
        height: 38px;
      }

      .vini-os-desktop-icons,
      .vini-os-tray {
        display: none;
      }

      .vini-os-dock {
        right: 12px;
        bottom: 12px;
        left: 12px;
        justify-content: center;
        height: 54px;
        transform: none;
      }

      .vini-os-dock-icon {
        width: 38px;
        height: 38px;
      }

      .office-toolbar {
        padding-inline: 8px;
      }

      .office-toolbar-row {
        gap: 5px;
      }

      .office-command-button {
        width: 32px;
        max-width: 32px;
        padding-inline: 0;
      }

      .office-command-button .office-button-label {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

    }
  </style>
</body>
</html>
