<html>
<head>
  <script type="module">
    import { store } from "/components/canvas/right-canvas-store.js";
  </script>
</head>
<body>
  <div x-data>
    <template x-if="$store.rightCanvas">
      <aside
        id="right-canvas"
        class="right-canvas"
        :class="{
          'is-open': $store.rightCanvas.isOpen,
          'is-closed': !$store.rightCanvas.isOpen,
          'is-overlay': $store.rightCanvas.isOverlayMode,
          'is-mobile': $store.rightCanvas.isMobileMode,
          'is-os-mode': true,
          'has-os-browser': $store.rightCanvas.isOsAppOpen('browser'),
          'has-os-editor': $store.rightCanvas.isOsAppOpen('editor'),
          'is-os-browser-active': $store.rightCanvas.isOsAppActive('browser'),
          'is-os-editor-active': $store.rightCanvas.isOsAppActive('editor')
        }"
        :style="$store.rightCanvas.widthStyle()"
        x-show="$store.rightCanvas.shouldRender()"
        x-init="$store.rightCanvas.init($el)"
        x-effect="$store.rightCanvas.applyLayoutState()"
        aria-label="Vini AI Computer"
      >
        <div class="right-canvas-resize-handle" title="Resize Vini AI Computer" @pointerdown="$store.rightCanvas.startResize($event)"></div>

        <nav class="right-canvas-rail" aria-label="Vini AI Computer surfaces">
          <button
            type="button"
            class="right-canvas-rail-button right-canvas-toggle-button"
            :class="{ 'is-active': $store.rightCanvas.isOpen }"
            :title="$store.rightCanvas.isOpen ? 'Hide Vini AI Computer' : 'Show Vini AI Computer'"
            :aria-label="$store.rightCanvas.isOpen ? 'Hide Vini AI Computer' : 'Show Vini AI Computer'"
            :aria-pressed="$store.rightCanvas.isOpen.toString()"
            @click="$store.rightCanvas.toggleCanvas()"
          >
            <span class="material-symbols-outlined">dock_to_right</span>
          </button>
        </nav>

        <section class="right-canvas-shell">
          <x-extension id="right-canvas-shell-start"></x-extension>

          <main class="right-canvas-panels">
            <div class="right-canvas-os-controls" aria-label="Vini OS controls">
              <button
                type="button"
                class="right-canvas-icon-button"
                title="Open current app as window"
                aria-label="Open current app as window"
                x-show="$store.rightCanvas.currentSurfaceCanUndock()"
                @click="$store.rightCanvas.undockActiveSurface()"
              >
                <span class="material-symbols-outlined">open_in_new</span>
              </button>
              <button
                type="button"
                class="right-canvas-icon-button right-canvas-close-button"
                title="Close Vini Computer"
                aria-label="Close Vini Computer"
                @click="$store.rightCanvas.close()"
              >
                <span class="material-symbols-outlined">close</span>
              </button>
            </div>
            <button
              type="button"
              class="vini-os-window-close vini-os-browser-close"
              title="Close Browser"
              aria-label="Close Browser"
              x-show="$store.rightCanvas.isOsAppOpen('browser')"
              @click="$store.rightCanvas.closeOsApp('browser')"
            >
              <span class="material-symbols-outlined">close</span>
            </button>
            <button
              type="button"
              class="vini-os-window-close vini-os-editor-close"
              title="Close Editor"
              aria-label="Close Editor"
              x-show="$store.rightCanvas.isOsAppOpen('editor')"
              @click="$store.rightCanvas.closeOsApp('editor')"
            >
              <span class="material-symbols-outlined">close</span>
            </button>
            <x-extension id="right-canvas-panels"></x-extension>
            <template x-if="$store.rightCanvas.panelSurfaces.length === 0">
              <div class="right-canvas-empty-state">
                <x-extension id="right-canvas-empty-state"></x-extension>
                <span class="right-canvas-empty-icon material-symbols-outlined">desktop_windows</span>
                <strong>Vini AI Computer is ready</strong>
                <p>Browser, desktop, editor, and terminal activity appears here while the task runs.</p>
              </div>
            </template>
          </main>

          <x-extension id="right-canvas-shell-end"></x-extension>
        </section>
      </aside>
    </template>
  </div>
</body>
</html>
