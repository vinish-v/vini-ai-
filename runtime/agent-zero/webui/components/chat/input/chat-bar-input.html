<html>
<head>
    <script type="module">
        import { store as fullScreenStore } from "/components/modals/full-screen-input/full-screen-store.js";
        import { store as messageQueueStore } from "/components/chat/message-queue/message-queue-store.js";
        import { store as chatInputStore } from "/components/chat/input/input-store.js";
    </script>
</head>
<body>
    <div x-data>
        <x-extension id="chat-input-box-start"></x-extension>
        <div class="input-row">
        <!-- More actions (+): opens upward; content lives in bottom-actions.html -->
        <div
            class="attachment-wrapper chat-more-dropdown"
            @click.outside="$store.chatInput.closeChatMoreMenu()"
            @keydown.escape.window="$store.chatInput.closeChatMoreMenu()"
        >
            <button
                type="button"
                class="chat-more-trigger"
                @click.stop="$store.chatInput.toggleChatMoreMenu()"
                :aria-expanded="$store.chatInput.chatMoreMenuOpen.toString()"
                aria-label="More actions"
            >
                <span class="material-symbols-outlined" aria-hidden="true">add</span>
            </button>
            <div
                class="chat-more-panel"
                x-show="$store.chatInput.chatMoreMenuOpen"
                x-transition
                style="display: none;"
            >
                <x-component path="chat/input/bottom-actions.html"></x-component>
            </div>
        </div>

        <!-- Container for textarea and expand button -->
        <div id="chat-input-container" style="position: relative;">
            <textarea id="chat-input" :placeholder="$store.chatInput.inputPlaceholder" rows="1"
                      @keydown.enter="if (!$event.shiftKey && !$event.isComposing && $event.keyCode !== 229) { $event.preventDefault(); $store.chatInput.sendMessage(); }"
                      @keydown.up="$store.chatInput.historyPrev($event)"
                      @keydown.down="$store.chatInput.historyNext($event)"
                      @input="$store.chatInput.adjustTextareaHeight()"
                      x-model="$store.chatInput.message"></textarea>
            <div
                id="chat-input-progress-placeholder"
                x-show="$store.chatInput.showProgressPlaceholder"
                x-html="$store.chatInput.progressPlaceholderHtml"
                :class="{ 'progress-active': $store.chatInput.progressActive }"
                aria-hidden="true"
                style="display: none;"
            ></div>
            <button id="expand-button" @click="$store.fullScreenInputModal.openModal()" aria-label="Expand input">
                <span class="material-symbols-outlined" aria-hidden="true">open_in_full</span>
            </button>
        </div>

        <div id="chat-buttons-wrapper">
            <!-- Send button -->
            <button class="chat-button" id="send-button"
                    :aria-label="$store.chatInput.sendButtonTitle"
                    @click="$store.chatInput.sendMessage()"
                    :class="$store.chatInput.sendButtonClass"
                    :title="$store.chatInput.sendButtonTitle">
                    <span class="material-symbols-outlined" x-text="$store.chatInput.sendButtonIcon"></span>
            </button>
        </div>
        </div>

        <!-- Full Screen Input Modal -->
        <x-component path="modals/full-screen-input/full-screen-input.html"></x-component>
        <x-component path="modals/voice-conversation/voice-conversation.html"></x-component>
        <x-extension id="chat-input-box-end"></x-extension>
    </div>


    <style>
    /* Manus-style compact command composer */
    .input-row {
      isolation: isolate;
      overflow: visible;
      position: relative;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: end;
      gap: 0.72rem;
      width: 100%;
      max-width: min(780px, calc(100vw - 2rem));
      min-height: 6.9rem;
      margin: 0 auto;
      padding: 1.02rem;
      border: 1px solid rgba(255,255,255,0.105);
      border-radius: 24px;
      background:
        radial-gradient(circle at 72% 16%, rgba(91,101,255,0.14), transparent 34%),
        radial-gradient(circle at 12% 100%, rgba(255,255,255,0.07), transparent 34%),
        linear-gradient(180deg, rgba(255,255,255,0.075), rgba(255,255,255,0.03)),
        rgba(22,23,27,0.94);
      box-shadow:
        0 24px 70px rgba(0,0,0,0.42),
        0 1px 0 rgba(255,255,255,0.06) inset,
        0 -1px 0 rgba(0,0,0,0.48) inset;
      white-space: nowrap;
      backdrop-filter: blur(18px);
      transition: border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
    }

    .input-row:focus-within {
      border-color: rgba(138,145,255,0.38);
      box-shadow:
        0 0 0 1px rgba(74,91,255,0.2),
        0 26px 74px rgba(0,0,0,0.44),
        0 18px 54px rgba(78,91,255,0.1),
        0 1px 0 rgba(255,255,255,0.07) inset;
    }

    .input-row::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, rgba(255,255,255,0.22), rgba(91,101,255,0.18) 42%, rgba(255,255,255,0.06));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: 0.58;
      z-index: 0;
    }

    .input-row::after {
      content: "";
      position: absolute;
      left: 1.02rem;
      right: 1.02rem;
      bottom: 3.75rem;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.055), transparent);
      opacity: 0.8;
      pointer-events: none;
      z-index: 0;
    }

    .input-row > * {
      position: relative;
      z-index: 1;
    }

    body.right-canvas-open .input-row {
      max-width: max(420px, min(720px, calc(100vw - var(--right-canvas-width, 560px) - 4rem)));
    }
    
    .attachment-wrapper { position: relative; flex-shrink: 0; }

    /* Composer + menu: custom panel (edit here; not shared with file-browser dropdown) */
    .chat-more-dropdown { z-index: 40; }
    .chat-more-trigger {
      cursor: pointer;
      color: var(--color-text);
      opacity: 0.92;
      transition: opacity 0.2s ease, transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 2.86rem;
      height: 2.86rem;
      padding: 0;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 15px;
      background: rgba(255,255,255,0.055);
      box-shadow: 0 12px 28px rgba(0,0,0,0.26), inset 0 1px 0 rgba(255,255,255,0.06);
    }
    .chat-more-trigger:hover {
      opacity: 1;
      transform: translateY(-1px);
      border-color: rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.085);
    }
    .chat-more-trigger:active { opacity: 0.7; transform: translateY(0); }
    .chat-more-trigger[aria-expanded="true"] {
      opacity: 1;
      border-color: rgba(138,145,255,0.34);
      background: rgba(97,107,255,0.13);
      box-shadow: 0 12px 28px rgba(0,0,0,0.28), 0 0 0 1px rgba(97,107,255,0.16) inset;
    }
    .chat-more-trigger[aria-expanded="true"] .material-symbols-outlined {
      transform: rotate(45deg);
    }
    .chat-more-trigger .material-symbols-outlined {
      font-size: 1.5rem;
      line-height: 1;
      transition: transform 0.16s ease;
    }
    .chat-more-panel {
      position: absolute;
      left: 0;
      bottom: calc(100% + 0.72rem);
      margin-bottom: 0;
      min-width: 13.25rem;
      max-width: min(20rem, 92vw);
      max-height: min(70vh, 24rem);
      overflow-x: hidden;
      overflow-y: auto;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.018)),
        rgba(14,15,19,0.98);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.42), 0 1px 0 rgba(255,255,255,0.06) inset;
      z-index: 1050;
      padding: 0.24rem;
    }
    .light-mode .chat-more-panel {
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
    }
/* Text input */
    #chat-input-container {
    position: relative;
    width: 100%;
    }
    #chat-input {
    background: transparent;
    border: 0;
    border-radius: 0;
    color: var(--color-text);
    flex-grow: 1;
    font-family: "Roboto Mono", monospace;
    font-optical-sizing: auto;
    -webkit-font-optical-sizing: auto;
    font-size: 0.98rem;
    line-height: 1.55;
    max-height: 60vh;
    min-height: 4.6rem;
    width: 100%;
    padding: 0.18rem 44px 0.55rem 0;
    margin-right: var(--spacing-xs);
    overflow-y: auto;
    scroll-behavior: smooth;
    resize: none;
    align-content: start;
    background-clip: border-box;
    outline: 0;
    box-shadow: none;
    text-align: left;
    transition: background-color 0.18s ease, outline-color 0.18s ease, box-shadow 0.18s ease, color 0.18s ease;
    -webkit-transition: background-color 0.18s ease, outline-color 0.18s ease, box-shadow 0.18s ease, color 0.18s ease;
    }
    #chat-input::-webkit-scrollbar { width: 6px; height: 6px; }
    #chat-input::-webkit-scrollbar-track { background: transparent; margin: 4px 0; border-radius: 6px; }
    #chat-input::-webkit-scrollbar-thumb { background-color: rgba(155,155,155,0.5); border-radius: 6px; -webkit-transition: background-color 0.2s ease; transition: background-color 0.2s ease; }
    #chat-input::-webkit-scrollbar-thumb:hover { background-color: rgba(155,155,155,0.7); }
    #chat-input:focus,
    #chat-input:not(:placeholder-shown) {
      outline: 0;
      background-color: transparent;
      box-shadow: none;
      text-align: left;
    }
    #chat-input::placeholder {
      color: rgba(255,255,255,0.42);
      opacity: 1;
      transition: color 0.3s ease;
      text-align: left;
    }

    /* Progress ghost text animation — gentle pulse on placeholder */
    #chat-input.progress-active::placeholder {
      animation: placeholder-pulse 2s ease-in-out infinite;
    }
    @keyframes placeholder-pulse {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 0.85; }
    }
    #chat-input.progress-active {
      border-color: color-mix(in srgb, var(--color-highlight) 20%, transparent);
      outline-color: color-mix(in srgb, var(--color-highlight) 15%, transparent);
    }
    #chat-input-progress-placeholder {
      position: absolute;
      top: calc(6px + 0.48rem);
      left: calc(6px + var(--spacing-sm));
      right: 46px;
      color: var(--color-text-muted);
      opacity: 0.7;
      font-family: "Roboto Mono", monospace;
      font-size: 0.9rem;
      line-height: 1.45;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
    #chat-input-progress-placeholder.progress-active {
      animation: placeholder-pulse 2s ease-in-out infinite;
    }
    #chat-input-progress-placeholder .chat-input-progress-cue {
      color: var(--color-text-muted);
    }
    #chat-input-progress-placeholder .chat-input-progress-icon {
      font-size: 1.15rem;
      line-height: 1;
      color: var(--color-highlight);
      vertical-align: -0.18rem;
    }

    #expand-button { 
    position: absolute;
    top: auto;
    bottom: 0.62rem;
    right: 0.22rem;
    width: 2rem;
    height: 2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    cursor: pointer;
    font-size: 1.2rem;
    color: var(--color-text);
    opacity: 0.52;
    transition: opacity 0.2s ease, background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }
    #expand-button:hover {
      opacity: 0.92;
      background: rgba(255,255,255,0.075);
      border-color: rgba(255,255,255,0.13);
      transform: translateY(-1px);
    }
    #expand-button:active { opacity: 1; }
    #expand-button .material-symbols-outlined { display: block; font-size: 1.15rem; line-height: 1; }

    /* Chat buttons (Send/Mic) */
    #chat-buttons-wrapper {
      gap: 0.5rem;
      padding-left: 0;
      line-height: 0.5rem;
      display: -webkit-flex;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      align-self: end;
    }
    .chat-button {
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      color: #ffffff;
      cursor: pointer;
      font-size: var(--font-size-normal);
      height: 2.95rem;
      width: 2.95rem;
      margin: 0;
      display: -webkit-flex;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      flex-grow: 0;
      min-width: 2.95rem;
      box-shadow: 0 14px 32px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.08);
      -webkit-transition: background-color var(--transition-speed), box-shadow 0.16s ease-in-out, filter 0.16s ease-in-out, transform 0.16s ease-in-out, border-color 0.16s ease-in-out;
      transition: background-color var(--transition-speed), box-shadow 0.16s ease-in-out, filter 0.16s ease-in-out, transform 0.16s ease-in-out, border-color 0.16s ease-in-out;
    }
    #send-button { background: linear-gradient(135deg, #6972ff, #4654ff 58%, #3440d7); }
    #send-button.send-queue { background-color: #e67e22; }
    #send-button.stop {
      background: linear-gradient(135deg, #ff5a5f, #d93035 58%, #a81f24);
      border-color: rgba(255,255,255,0.16);
      box-shadow: 0 14px 32px rgba(217,48,53,0.32), inset 0 1px 0 rgba(255,255,255,0.1);
    }
    #send-button.stop.stopping {
      cursor: progress;
      filter: saturate(0.88);
      opacity: 0.86;
    }
    #send-button:hover {
      border-color: rgba(255,255,255,0.18);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 16px 34px rgba(70,84,255,0.34);
      transform: translateY(-1px);
    }
    #send-button.send-queue:hover { background-color: #d35400; }
    #send-button.stop:hover {
      box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 16px 34px rgba(217,48,53,0.38);
    }
    #send-button:active { background-color: #2b309c; filter: brightness(0.96); }
    #chat-buttons-wrapper .chat-button:not(#send-button) {
      background: rgba(255,255,255,0.78);
      color: #050608;
      border-color: rgba(255,255,255,0.22);
    }
    #chat-buttons-wrapper .chat-button:not(#send-button):hover {
      background: rgba(255,255,255,0.78);
      transform: translateY(-1px);
    }
    .chat-button svg { width: 1.5rem; height: 1.5rem; }
    #send-button .material-symbols-outlined { font-size: 1.5rem; }
    
    /* Responsive tweaks */
    @media (max-width: 640px) {
      .input-row {
        grid-template-columns: auto minmax(0, 1fr);
        min-height: 7.4rem;
        padding: 0.82rem;
        border-radius: 20px;
      }
      #chat-input { min-height: 4.7rem; align-content: start; }
      .chat-more-trigger,
      .chat-button { width: 2.85rem; height: 2.85rem; min-width: 2.85rem; border-radius: 15px; }
      #chat-buttons-wrapper {
        grid-column: 1 / -1;
        display: flex;
        gap: var(--spacing-xs);
        padding: 0 !important;
        width: auto;
        flex-wrap: wrap;
        justify-content: flex-end;
        -webkit-transition: all 0.3s ease;
        transition: all 0.3s ease;
      }
    }
    @media (min-width: 768px) { #chat-buttons-wrapper { flex-wrap: nowrap; -webkit-flex-wrap: nowrap; flex-wrap: nowrap; } }
    </style>
</body>
</html>
