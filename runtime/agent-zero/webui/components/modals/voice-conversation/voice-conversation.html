<html>
<head>
  <script type="module">
    import { store } from "/components/modals/voice-conversation/voice-conversation-store.js";
  </script>
</head>
<body>
  <div x-data x-init="$store.voiceConversation?.init()">
    <template x-if="$store.voiceConversation">
      <template x-teleport="body">
        <div
          x-show="$store.voiceConversation.isOpen"
          class="voice-conversation-overlay"
          @keydown.escape.window="$store.voiceConversation.isOpen && $store.voiceConversation.close()"
          x-transition
          style="display: none;"
        >
          <div class="voice-conversation-shell">
            <div class="voice-conversation-topbar">
              <div>
                <div class="voice-title">Vini AI Voice</div>
                <div class="voice-subtitle" x-text="$store.voiceConversation.statusText"></div>
              </div>
              <button class="voice-close-button" @click="$store.voiceConversation.close()" aria-label="Close voice conversation">
                <span class="material-symbols-outlined" aria-hidden="true">close</span>
              </button>
            </div>

            <div class="voice-orb-stage">
              <canvas id="voice-orb-canvas" aria-hidden="true"></canvas>
              <div class="voice-orb-core" :class="`voice-state-${$store.voiceConversation.status}`">
                <span class="material-symbols-outlined" aria-hidden="true">graphic_eq</span>
              </div>
            </div>

            <div class="voice-status-row">
              <span class="voice-live-dot" :class="{ active: ['listening', 'recording', 'speaking'].includes($store.voiceConversation.status) }"></span>
              <span x-text="$store.voiceConversation.vadLabel"></span>
            </div>

            <div class="voice-transcript-grid">
              <div class="voice-transcript-card">
                <span>You</span>
                <p x-text="$store.voiceConversation.userText || 'Start speaking to send a message.'"></p>
              </div>
              <div class="voice-transcript-card">
                <span>Vini AI</span>
                <p x-text="$store.voiceConversation.assistantText || 'Responses will play here with barge-in enabled.'"></p>
              </div>
            </div>

            <template x-if="$store.voiceConversation.error">
              <div class="voice-error" x-text="$store.voiceConversation.error"></div>
            </template>

            <div class="voice-footer-actions">
              <button class="voice-pill-button" @click="$store.voiceConversation.start()" :disabled="$store.voiceConversation.stream">
                <span class="material-symbols-outlined" aria-hidden="true">mic</span>
                Listen
              </button>
              <button class="voice-pill-button" @click="$store.voiceConversation.stopAudio()">
                <span class="material-symbols-outlined" aria-hidden="true">volume_off</span>
                Stop audio
              </button>
              <button class="voice-pill-button danger" @click="$store.voiceConversation.close()">
                <span class="material-symbols-outlined" aria-hidden="true">call_end</span>
                End
              </button>
            </div>
          </div>
        </div>
      </template>
    </template>
  </div>

  <style>
    .voice-conversation-overlay {
      position: fixed;
      inset: 0;
      z-index: 3200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(1rem, 3vw, 2.4rem);
      background:
        radial-gradient(circle at 50% 25%, rgba(88,101,255,0.2), transparent 34%),
        radial-gradient(circle at 50% 70%, rgba(34,211,238,0.12), transparent 38%),
        rgba(2, 3, 7, 0.92);
      backdrop-filter: blur(24px);
    }

    .voice-conversation-shell {
      width: min(920px, 100%);
      min-height: min(680px, calc(100vh - 1rem));
      max-height: calc(100vh - 1rem);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      padding: 1.2rem;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 28px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.075), rgba(255,255,255,0.025)),
        rgba(9, 10, 15, 0.86);
      box-shadow:
        0 50px 120px rgba(0,0,0,0.58),
        inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .voice-conversation-topbar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.35rem 0.45rem 0.6rem;
    }

    .voice-title {
      color: #fff;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0;
    }

    .voice-subtitle {
      margin-top: 0.2rem;
      color: rgba(255,255,255,0.62);
      font-size: 0.86rem;
      line-height: 1.35;
    }

    .voice-close-button,
    .voice-pill-button {
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.055);
      color: rgba(255,255,255,0.9);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
      cursor: pointer;
    }

    .voice-close-button {
      width: 2.7rem;
      height: 2.7rem;
      border-radius: 14px;
      display: grid;
      place-items: center;
    }

    .voice-orb-stage {
      position: relative;
      width: min(460px, 78vw, 46vh);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
    }

    #voice-orb-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .voice-orb-core {
      position: relative;
      width: clamp(6.8rem, 19vw, 10.5rem);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.14);
      background:
        radial-gradient(circle at 35% 28%, rgba(255,255,255,0.2), transparent 28%),
        radial-gradient(circle at 60% 72%, rgba(32,211,238,0.32), transparent 42%),
        linear-gradient(135deg, rgba(92,103,255,0.82), rgba(18,21,35,0.96));
      box-shadow:
        0 0 60px rgba(81,94,255,0.38),
        0 0 140px rgba(34,211,238,0.16),
        inset 0 1px 0 rgba(255,255,255,0.18);
    }

    .voice-orb-core.voice-state-recording,
    .voice-orb-core.voice-state-speaking {
      animation: voice-orb-pulse 1.15s ease-in-out infinite;
    }

    .voice-orb-core .material-symbols-outlined {
      font-size: clamp(2.7rem, 7vw, 4.4rem);
      color: #ffffff;
      text-shadow: 0 0 24px rgba(255,255,255,0.35);
    }

    @keyframes voice-orb-pulse {
      0%, 100% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.045); filter: brightness(1.13); }
    }

    .voice-status-row {
      min-height: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      color: rgba(255,255,255,0.72);
      font-size: 0.92rem;
    }

    .voice-live-dot {
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 999px;
      background: rgba(255,255,255,0.24);
    }

    .voice-live-dot.active {
      background: #20e3b2;
      box-shadow: 0 0 20px rgba(32,227,178,0.58);
    }

    .voice-transcript-grid {
      width: min(720px, 100%);
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.75rem;
    }

    .voice-transcript-card {
      min-height: 6rem;
      padding: 0.9rem 1rem;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      color: rgba(255,255,255,0.72);
    }

    .voice-transcript-card span {
      display: block;
      margin-bottom: 0.45rem;
      color: rgba(255,255,255,0.46);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .voice-transcript-card p {
      margin: 0;
      color: rgba(255,255,255,0.82);
      font-size: 0.9rem;
      line-height: 1.55;
    }

    .voice-error {
      width: min(720px, 100%);
      padding: 0.8rem 0.9rem;
      border: 1px solid rgba(255, 91, 91, 0.36);
      border-radius: 14px;
      background: rgba(255, 91, 91, 0.12);
      color: #ffb5b5;
      font-size: 0.86rem;
    }

    .voice-footer-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.65rem;
      padding-top: 0.2rem;
    }

    .voice-pill-button {
      min-height: 2.55rem;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0 0.95rem;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 650;
    }

    .voice-pill-button:disabled {
      opacity: 0.48;
      cursor: default;
    }

    .voice-pill-button.danger {
      border-color: rgba(255, 91, 91, 0.25);
      color: #ffc7c7;
      background: rgba(255, 91, 91, 0.08);
    }

    @media (max-width: 720px) {
      .voice-conversation-shell {
        min-height: calc(100vh - 1rem);
        border-radius: 22px;
      }
      .voice-transcript-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</body>
</html>
